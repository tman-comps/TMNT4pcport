# Builds the Windows launcher on GitHub's servers every time you push, and attaches it to a
# Release when you push a version tag (e.g. v1.0.0).
#
# This project builds with a Makefile and mingw-w64 (cross-compiled on Linux), not CMake.
# GitHub has no ROM, so it builds the *launcher*: the version with no generated game code, which
# runs the game on the built-in SNES core from the player's own ROM. The faster native build
# (`make gen` + `make win`) needs the ROM and is built locally only.
#
# No ROM or game data is ever used or included here.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # needed to create Releases

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install the compilers
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 make curl

      - name: Get SDL2 for Windows
        run: make sdl2

      - name: Build the Windows launcher
        run: make -j2 tmnt_launcher.exe

      - name: Package
        run: |
          mkdir -p package/msu
          cp tmnt_launcher.exe package/
          cp third_party/SDL2-mingw/x86_64-w64-mingw32/bin/SDL2.dll package/
          cp README.md THIRD_PARTY_LICENSES.txt package/
          cp msu/README.txt msu/msu.txt package/msu/
          cd package && zip -r ../TurtlesInTime-windows.zip .

      - name: Make sure no ROM or game data slipped into the package
        run: |
          if unzip -l TurtlesInTime-windows.zip | grep -Ei '\.(sfc|smc|swc|fig|pcm)$'; then
            echo "ROM or audio file found in the package"; exit 1
          fi

      - name: Keep the build (downloadable from the Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: TurtlesInTime-windows
          path: TurtlesInTime-windows.zip

      - name: Publish Release (only for version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TurtlesInTime-windows.zip
          generate_release_notes: true

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build the Linux launcher and tools
        run: make -j2 tmnt_launcher tmnt_tool_interp romhash
